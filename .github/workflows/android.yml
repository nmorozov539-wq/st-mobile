name: Android debug APK

on:
  push:
    branches: [main, 'claude/**']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write  # only used to update the rolling pre-release on main

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache pinned Node runtime
        uses: actions/cache@v4
        with:
          path: android/app/build/node-runtime/*.zip
          key: node-runtime-${{ hashFiles('android/node-runtime.properties') }}

      - name: Build debug APKs
        run: ./gradlew assembleDebug --console=plain

      - name: Collect APKs
        run: |
          mkdir -p ../dist
          for f in app/build/outputs/apk/debug/*.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-debug\.apk$/\1/')
            cp "$f" "../dist/pocket-tavern-step2-${abi}-debug.apk"
          done
          ls -la ../dist
          sha256sum ../dist/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-tavern-step2-debug
          path: dist/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: x86_64-apk-for-smoke-test
          path: dist/*x86_64*.apk
          retention-days: 3

      - name: Update rolling pre-release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug-latest
          name: Android debug build (latest main)
          prerelease: true
          files: dist/*.apk

  # Boots the x86_64 APK on an emulator and checks that the bundled SillyTavern serves its UI.
  emulator-smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: x86_64-apk-for-smoke-test
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and run smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash android/scripts/emulator-smoke.sh dist/pocket-tavern-step2-x86_64-debug.apk smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke-results
          path: smoke/
