name: Android debug APK

on:
  push:
    branches: [main, 'claude/**']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write  # only used to update the rolling pre-release on main

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache pinned Node runtime
        uses: actions/cache@v4
        with:
          path: android/app/build/node-runtime/*.zip
          key: node-runtime-${{ hashFiles('android/node-runtime.properties') }}

      - name: Build debug APKs
        run: ./gradlew assembleDebug --console=plain

      - name: Collect APKs
        run: |
          mkdir -p ../dist
          for f in app/build/outputs/apk/debug/*.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-debug\.apk$/\1/')
            cp "$f" "../dist/pocket-tavern-step1-${abi}-debug.apk"
          done
          ls -la ../dist
          sha256sum ../dist/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-tavern-step1-debug
          path: dist/*.apk
          if-no-files-found: error

      - name: Update rolling pre-release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug-latest
          name: Android debug build (latest main)
          prerelease: true
          files: dist/*.apk
