<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STM transition export</title></head>
<body><h1>Export before upgrading</h1>
<p>Run this on the same address you used for the old interface. It only reads. Nothing is changed or deleted.</p>
<button id="go">Download migration bundle</button><pre id="out"></pre>
<script type="module">
import {exportLegacy} from './exporter.js';
document.getElementById('go').onclick = () => {
  const b = exportLegacy(localStorage, {origin: location.origin});
  const a = Object.assign(document.createElement('a'), {download: 'stm-migration-' + b.createdAt.slice(0, 10) + '.json', href: URL.createObjectURL(new Blob([JSON.stringify(b, null, 1)], {type: 'application/json'}))});
  a.click();
  out.textContent = 'Sections: ' + Object.keys(b.sections).join(', ') + (b.problems.length ? '\nUnreadable: ' + b.problems.map(p => p.key).join(', ') : '');
};
</script></body></html>
